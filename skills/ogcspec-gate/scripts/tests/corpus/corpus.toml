# Manifest of the real OGC documents the gate is exercised against. The documents themselves are NOT
# stored in this repository (their licence is not established here and they are large). To run, check
# each repository out at `sha` under a corpus root, compile with the pinned Metanorma image
# (see compile), and point OGCSPEC_CORPUS at the root. Each `xml` path is relative to <root>/<dir>.
#
# compile: uv run skills/ogcspec-metanorma/scripts/metanorma.py --image <pinned digest> \
#            --root <root>/<dir> --adoc <root>/<dir>/<adoc> --formats xml
# (offline, as the wrapper does by default). Observed 2026-11-06.

