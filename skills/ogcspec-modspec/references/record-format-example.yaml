# Worked example for references/record-format-proposal.md. Every identifier, name and URI here is a placeholder
# for illustration; none is assigned, registered or proposed for a real standard.
#
# Uses every field of the record format (record-format-proposal.md, section 3): `status`, `uml_package`, `title`,
# `profile`, and `depends_on` (external dependencies only). The gate checks them (G002-G004, M013, M014, S003, S004)
# and the emitter writes titles and dependencies into the document; this file passes the gate with the config below.
# It is one list in one file for brevity; the recommended layout is one record per file (proposal, section 10).
#
# Baseline for the Metanorma messages this example produces: record-format-example.baseline.json (see proposal, section 9).
#
# Gate config this example assumes (ogcspec.gate.toml). Top-level keys must come before the first [[table]]:
#   records_dir = "records"
#   core = "/req/core"
#   style = ["uml"]
#   [[normative_references]]
#   name = "Example dependency"
#   uri_prefix = "https://example.org/spec/dep/1.0/"

- kind: requirements_class
  id: /req/core
  title: Core
  status: proposed
  uml_package: example::core
  subject: Example document
  inherit:
    - https://example.org/spec/dep/1.0/req/base
  requirements:
    - /req/core/first
    - /req/core/second

- kind: requirement
  id: /req/core/first
  status: proposed
  statement: A document SHALL do the first thing.

- kind: requirement
  id: /req/core/second
  status: proposed
  statement: A document SHALL do the second thing.

- kind: abstract_test
  id: /conf/core/first
  status: proposed
  target: /req/core/first
  purpose: Verify the first thing.
  steps:
    - Check that the document does the first thing.

- kind: abstract_test
  id: /conf/core/second
  status: proposed
  target: /req/core/second
  purpose: Verify the second thing.

- kind: conformance_class
  id: /conf/core
  title: Core
  status: proposed
  target: /req/core
  # Req 12: the other conformance class this one depends on. External only. The dependency on `/conf/core`
  # that /conf/ext has is NOT written here: it is derived from /req/ext's `inherit` (proposal, section 4).
  # Writing a derived internal one here is G004; an indirect dependency on a class of this document with a different
  # target (which `inherit` cannot give) is written here (proposal, section 4).
  depends_on:
    - https://example.org/spec/dep/1.0/conf/base
  tests:
    - /conf/core/first
    - /conf/core/second

- kind: requirements_class
  id: /req/ext
  title: Extension
  status: proposed
  uml_package: example::ext
  subject: Example document
  inherit:
    - /req/core
  requirements:
    - /req/ext/third

- kind: requirement
  id: /req/ext/third
  status: proposed
  statement: A document SHALL do the third thing.

- kind: abstract_test
  id: /conf/ext/third
  status: proposed
  target: /req/ext/third
  purpose: Verify the third thing.

- kind: conformance_class
  id: /conf/ext
  title: Extension
  status: proposed
  target: /req/ext
  tests:
    - /conf/ext/third

# A profile (Req 19) is two ordinary records: a requirements class that lists no requirements and builds on other classes
# (profile: true), and its conformance class with no tests. The emitter derives the conformance class's dependencies, so
# the union of /conf/core and /conf/ext is stated in the document without being written twice. Metanorma itself warns
# (MODSPEC_1) that both classes are empty; accept those two messages in the baseline (record-format-example.baseline.json; proposal, section 9).
- kind: requirements_class
  id: /req/prof
  title: Profile
  status: proposed
  uml_package: example::prof
  profile: true
  subject: Example document
  inherit:
    - /req/core
    - /req/ext
  requirements: []

- kind: conformance_class
  id: /conf/prof
  title: Profile
  status: proposed
  target: /req/prof
  tests: []
